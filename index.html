<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="李世豪的个人日程安排">
  <title>李世豪｜个人日程</title>
  <style>
    :root {
      --ink:#182033; --muted:#71798a; --line:#e9ebf1; --paper:#fff; --ground:#f6f7fb;
      --blue:#3769e9; --blue-soft:#eaf0ff; --violet:#8154d2; --violet-soft:#f2ebff;
      --green:#16955f; --green-soft:#e5f7ee; --amber:#a56208; --amber-soft:#fff3dc;
      --shadow:0 14px 38px rgba(27,39,74,.08);
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--ground); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button, input, select, textarea { font:inherit; }
    button { cursor:pointer; }
    .app { display:grid; grid-template-columns:252px minmax(0,1fr); min-height:100vh; }
    aside { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:28px 16px 20px; border-right:1px solid var(--line); background:#fff; }
    .brand { display:flex; align-items:center; gap:11px; padding:0 10px 29px; font-weight:780; color:var(--ink); text-decoration:none; }
    .avatar { display:grid; place-items:center; width:38px; height:38px; border-radius:12px; color:#fff; background:linear-gradient(135deg,#386be8,#7850d2); box-shadow:0 5px 13px rgba(55,105,233,.25); }
    .nav-label { padding:0 10px 9px; color:#9aa0ad; font-size:.72rem; font-weight:750; letter-spacing:.09em; }
    .nav { display:grid; gap:5px; }
    .nav-group { display:grid; gap:2px; }
    .nav-subnav { display:grid; gap:2px; margin:0 0 5px 32px; }
    .nav-subitem { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; border:0; border-radius:8px; padding:7px 9px; color:#768096; text-align:left; background:transparent; font-size:.82rem; }
    .nav-subitem:hover { color:var(--blue); background:#f5f7fd; }
    .nav-subitem.active { color:var(--blue); font-weight:720; background:var(--blue-soft); }
    .nav-item { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; border:0; border-radius:10px; padding:10px; color:#4d5668; text-align:left; background:transparent; }
    .nav-item:hover { color:var(--blue); background:#f5f7fd; }
    .nav-item.active { color:var(--blue); font-weight:740; background:var(--blue-soft); }
    .nav-left { display:flex; align-items:center; gap:10px; }
    .nav-icon { width:23px; text-align:center; font-size:1.06rem; }
    .count { min-width:22px; padding:1px 7px; border-radius:999px; color:#778096; background:#f0f2f7; text-align:center; font-size:.75rem; font-weight:700; }
    .nav-item.active .count { color:var(--blue); background:#dce7ff; }
    .side-bottom { margin-top:auto; padding:16px 10px 0; color:var(--muted); border-top:1px solid var(--line); font-size:.79rem; }
    .side-bottom a { display:block; margin-top:8px; color:var(--blue); text-decoration:none; font-weight:700; }
    main { width:100%; max-width:1060px; padding:38px clamp(22px,5vw,62px) 60px; margin:0 auto; }
    .mobile-brand { display:none; }
    .mobile-nav { display:none; }
    .heading { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:27px; }
    .eyebrow { margin:0 0 6px; color:var(--blue); font-size:.83rem; font-weight:760; letter-spacing:.05em; }
    h1 { margin:0; font-size:clamp(1.72rem,3.6vw,2.35rem); letter-spacing:-.04em; }
    .heading p:last-child { margin:8px 0 0; color:var(--muted); }
    .primary { border:0; border-radius:10px; padding:10px 14px; color:#fff; white-space:nowrap; background:var(--blue); box-shadow:0 6px 15px rgba(55,105,233,.24); font-weight:700; }
    .primary:hover { background:#2458da; }
    .overview-note { display:flex; align-items:center; gap:9px; margin-bottom:17px; padding:11px 13px; border:1px solid #dce7ff; border-radius:11px; color:#4f648f; background:#f8faff; font-size:.87rem; }
    .overview-note strong { color:var(--blue); }
    .filters { display:flex; gap:8px; margin-bottom:19px; }
    .filter { border:1px solid #e1e5ee; border-radius:999px; padding:6px 12px; color:var(--muted); background:#fff; font-size:.82rem; }
    .filter:hover { border-color:#afc3f8; color:var(--blue); }
    .filter.active { border-color:var(--blue); color:var(--blue); background:var(--blue-soft); font-weight:740; }
    .tasks { display:grid; gap:11px; }
    .task { display:grid; grid-template-columns:22px minmax(0,1fr) auto; align-items:start; gap:13px; padding:16px 17px; border:1px solid #e6e9f0; border-radius:14px; background:var(--paper); box-shadow:0 2px 5px rgba(38,52,83,.02); transition:border .18s,box-shadow .18s; }
    .task:hover { border-color:#cbd7f3; box-shadow:var(--shadow); }
    .task.done { opacity:.66; }
    .task.done .task-title { text-decoration:line-through; color:var(--muted); }
    .task-toggle { appearance:none; width:20px; height:20px; margin:3px 0 0; border:1.5px solid #c6b1e7; border-radius:6px; background:linear-gradient(135deg,#fff,var(--violet-soft)); cursor:pointer; }
    .task-toggle:checked { border-color:var(--green); background:var(--green); box-shadow:inset 0 0 0 4px #fff; }
    .task-body { min-width:0; }
    .task-title { margin:0; font-size:.98rem; font-weight:760; }
    .task-meta { display:flex; flex-wrap:wrap; gap:7px 12px; margin-top:7px; color:var(--muted); font-size:.83rem; }
    .task-note { margin-top:5px; color:var(--muted); font-size:.82rem; }
    .tag { display:inline-flex; align-items:center; border-radius:999px; padding:3px 8px; font-size:.74rem; font-weight:720; }
    .category { color:#5e51a0; background:var(--violet-soft); }
    .priority-high { color:var(--amber); background:var(--amber-soft); }
    .priority-normal { color:#4670ba; background:#eaf1ff; }
    .priority-low { color:#577b69; background:var(--green-soft); }
    .complete { color:var(--green); background:var(--green-soft); }
    .task-actions { display:flex; gap:4px; }
    .icon-button { width:28px; height:28px; border:0; border-radius:7px; color:#8a91a0; background:transparent; font-size:1rem; }
    .icon-button:hover { color:#c54d5c; background:#fff0f1; }
    .empty { padding:52px 24px; border:1px dashed #d8dde8; border-radius:14px; color:var(--muted); text-align:center; background:#fff; }
    .empty strong { display:block; margin-bottom:5px; color:var(--ink); font-size:1rem; }
    .footer { display:flex; justify-content:space-between; gap:12px; margin-top:24px; color:#89909e; font-size:.78rem; }
    dialog { width:min(540px,calc(100% - 32px)); padding:0; border:0; border-radius:17px; box-shadow:0 24px 70px rgba(18,28,57,.24); }
    dialog::backdrop { background:rgba(22,30,49,.35); }
    .dialog-head { display:flex; align-items:center; justify-content:space-between; padding:20px 22px 15px; border-bottom:1px solid var(--line); }
    .dialog-head h2 { margin:0; font-size:1.08rem; }
    .close { border:0; border-radius:7px; width:30px; height:30px; color:var(--muted); background:#f3f5f8; font-size:1.2rem; }
    form { padding:20px 22px 22px; }
    .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    label { display:grid; gap:6px; color:#4c5566; font-size:.84rem; font-weight:700; }
    .span-2 { grid-column:span 2; }
    input,select,textarea { width:100%; border:1px solid #dfe3eb; border-radius:9px; padding:9px 10px; color:var(--ink); background:#fff; }
    textarea { min-height:70px; resize:vertical; }
    input:focus,select:focus,textarea:focus { outline:2px solid #cfe0ff; border-color:var(--blue); }
    .form-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:19px; }
    .secondary { border:1px solid #dfe3eb; border-radius:9px; padding:9px 13px; color:#5b6475; background:#fff; font-weight:700; }
    @media (max-width:760px) {
      .app { display:block; }
      aside { display:none; }
      main { padding:18px 16px 42px; }
      .mobile-brand { display:flex; align-items:center; justify-content:space-between; margin-bottom:23px; }
      .mobile-brand .brand { padding:0; }
      .mobile-nav { display:flex; overflow:auto; gap:7px; margin-bottom:24px; padding-bottom:3px; }
      .mobile-nav .nav-item { width:auto; flex:0 0 auto; padding:8px 10px; border:1px solid #e3e6ee; background:#fff; }
      .mobile-nav .nav-group, .mobile-nav .nav-subnav { display:flex; gap:7px; margin:0; }
      .mobile-nav .nav-subitem { width:auto; flex:0 0 auto; padding:8px 10px; border:1px solid #e3e6ee; background:#fff; white-space:nowrap; }
      .mobile-nav .nav-icon,.mobile-nav .count { display:none; }
      .heading { flex-direction:column; margin-bottom:20px; }
      .primary { width:100%; }
      .task { grid-template-columns:20px minmax(0,1fr) 28px; gap:10px; padding:14px; }
      .field-grid { grid-template-columns:1fr; }
      .span-2 { grid-column:auto; }
      .footer { flex-direction:column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <a class="brand" href="./"><span class="avatar">李</span><span>李世豪 · 日程</span></a>
      <div class="nav-label">安排分类</div>
      <nav class="nav" id="desktop-nav" aria-label="日程分类"></nav>
      <div class="side-bottom">所有事项仅储存在这台设备的浏览器。<a href="resume/">查看个人简历 →</a></div>
    </aside>

    <main>
      <div class="mobile-brand"><a class="brand" href="./"><span class="avatar">李</span><span>李世豪 · 日程</span></a><a href="resume/" style="color:var(--blue);font-size:.86rem;font-weight:700;text-decoration:none;">简历 →</a></div>
      <nav class="mobile-nav" id="mobile-nav" aria-label="日程分类"></nav>
      <section class="heading" id="heading"></section>
      <div id="content"></div>
      <footer class="footer"><span>完成事项会从“待办总览”移出，仍可在所属分类中查看。</span><span id="updated-at"></span></footer>
    </main>
  </div>

  <dialog id="task-dialog">
    <div class="dialog-head"><h2>新建日程</h2><button class="close" type="button" id="close-dialog" aria-label="关闭">×</button></div>
    <form id="task-form">
      <div class="field-grid">
        <label class="span-2">事项<input name="title" maxlength="80" required placeholder="例如：完成项目周报"></label>
        <label>分类<select name="category"><option value="internship">实习日程</option><option value="recruiting" selected>秋招日程</option><option value="learning">学习工作</option></select></label>
        <label>优先级<select name="priority"><option value="高">高</option><option value="普通" selected>普通</option><option value="低">低</option></select></label>
        <label>日期<input name="date" type="date" required></label>
        <label>时间<select name="time"><option>全天</option><option>上午</option><option>下午</option><option>晚上</option><option>09:00</option><option>10:00</option><option>14:00</option><option>16:00</option></select></label>
        <label class="span-2">备注<textarea name="note" maxlength="160" placeholder="可选"></textarea></label>
      </div>
      <div class="form-actions"><button type="button" class="secondary" id="cancel-dialog">取消</button><button class="primary" type="submit">添加事项</button></div>
    </form>
  </dialog>

  <script>
    (function () {
      var STORAGE_KEY = "leeeseeho-schedule-v2";
      var LEGACY_KEY = "leeeseeho-schedule-completed-v1";
      var categories = {
        internship: { name: "实习日程", icon: "◈" },
        recruiting: { name: "秋招日程", icon: "◉" },
        learning: { name: "学习工作", icon: "◇" }
      };
      var defaults = [
        { id: "nanoxin-review", category: "recruiting", date: "2026-09-10", time: "晚上", title: "复习纳芯微之前的笔试题、面试题", priority: "高", note: "为次日面试准备", completed: false },
        { id: "nanoxin-interview", category: "recruiting", date: "2026-09-11", time: "晚上", title: "纳芯微面试", priority: "高", note: "具体时间暂未记录", completed: false },
        { id: "bfr-interview", category: "recruiting", date: "2026-09-17", time: "16:00", title: "晶丰明源面试", priority: "高", note: "—", completed: false }
      ];
      var state = { view: "overview", filter: "all", tasks: loadTasks() };
      var dialog = document.getElementById("task-dialog");

      function loadTasks() {
        try {
          var stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(stored)) return stored;
        } catch (error) {}
        var old = {};
        try { old = JSON.parse(localStorage.getItem(LEGACY_KEY) || "{}"); } catch (error) {}
        return defaults.map(function (task) {
          var copy = Object.assign({}, task);
          copy.completed = old[copy.id] === true;
          return copy;
        });
      }
      function saveTasks() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks)); } catch (error) {}
      }
      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, function (char) {
          return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char];
        });
      }
      function dateLabel(date) {
        var d = new Date(date + "T12:00:00");
        var weekdays = ["周日","周一","周二","周三","周四","周五","周六"];
        return (d.getMonth() + 1) + "月" + d.getDate() + "日（" + weekdays[d.getDay()] + "）";
      }
      function orderValue(task) {
        var slots = { "上午":"09:00", "下午":"14:00", "晚上":"19:00", "全天":"00:00" };
        return task.date + " " + (slots[task.time] || task.time || "23:59");
      }
      function ordered(tasks) {
        return tasks.slice().sort(function (a, b) { return orderValue(a).localeCompare(orderValue(b)); });
      }
      function priorityClass(priority) {
        return priority === "高" ? "priority-high" : priority === "低" ? "priority-low" : "priority-normal";
      }
      function categoryCount(id) {
        return state.tasks.filter(function (task) { return task.category === id && !task.completed; }).length;
      }
      function navMarkup() {
        var overviewCount = state.tasks.filter(function (task) { return !task.completed; }).length;
        var overviewActive = state.view === "overview";
        var markup = '<button class="nav-item ' + (overviewActive ? "active" : "") + '" type="button" data-view="overview" data-filter="all"><span class="nav-left"><span class="nav-icon">☰</span><span>待办总览</span></span><span class="count">' + overviewCount + '</span></button>';
        Object.keys(categories).forEach(function (id) {
          var category = categories[id];
          var allTasks = state.tasks.filter(function (task) { return task.category === id; });
          var pending = allTasks.filter(function (task) { return !task.completed; }).length;
          var done = allTasks.length - pending;
          var allActive = state.view === id && state.filter === "all";
          var pendingActive = state.view === id && state.filter === "pending";
          var doneActive = state.view === id && state.filter === "done";
          markup += '<div class="nav-group">' +
            '<button class="nav-item ' + (allActive ? "active" : "") + '" type="button" data-view="' + id + '" data-filter="all"><span class="nav-left"><span class="nav-icon">' + category.icon + '</span><span>' + category.name + '</span></span><span class="count">' + allTasks.length + '</span></button>' +
            '<div class="nav-subnav">' +
              '<button class="nav-subitem ' + (pendingActive ? "active" : "") + '" type="button" data-view="' + id + '" data-filter="pending"><span>未完成</span><span class="count">' + pending + '</span></button>' +
              '<button class="nav-subitem ' + (doneActive ? "active" : "") + '" type="button" data-view="' + id + '" data-filter="done"><span>已完成</span><span class="count">' + done + '</span></button>' +
            '</div></div>';
        });
        return markup;
      }
      function taskMarkup(task, showCategory) {
        var status = task.completed ? '<span class="tag complete">已完成</span>' : "";
        var category = showCategory ? '<span class="tag category">' + categories[task.category].name + '</span>' : "";
        var note = task.note && task.note !== "—" ? '<div class="task-note">' + escapeHtml(task.note) + '</div>' : "";
        return '<article class="task ' + (task.completed ? "done" : "") + '">' +
          '<input class="task-toggle" data-toggle="' + task.id + '" type="checkbox" ' + (task.completed ? "checked" : "") + ' aria-label="切换完成状态">' +
          '<div class="task-body"><h2 class="task-title">' + escapeHtml(task.title) + '</h2>' +
          '<div class="task-meta"><span>' + dateLabel(task.date) + ' · ' + escapeHtml(task.time) + '</span>' + category +
          '<span class="tag ' + priorityClass(task.priority) + '">' + escapeHtml(task.priority) + '</span>' + status + '</div>' + note + '</div>' +
          '<div class="task-actions"><button class="icon-button" type="button" data-delete="' + task.id + '" aria-label="删除事项">×</button></div></article>';
      }
      function render() {
        document.getElementById("desktop-nav").innerHTML = navMarkup();
        document.getElementById("mobile-nav").innerHTML = navMarkup();
        var heading = document.getElementById("heading");
        var content = document.getElementById("content");
        if (state.view === "overview") {
          var pending = ordered(state.tasks.filter(function (task) { return !task.completed; }));
          heading.innerHTML = '<div><p class="eyebrow">待办总览</p><h1>按顺序完成今天的事</h1><p>这里只显示未完成安排；完成后将保留在对应分类的历史记录中。</p></div><button class="primary" type="button" data-add>＋ 新建事项</button>';
          content.innerHTML = (pending.length ? '<section class="tasks">' + pending.map(function(task){ return taskMarkup(task, true); }).join("") + '</section>' : '<div class="empty"><strong>当前没有待办事项</strong>可以从右上角添加新的安排。</div>');
        } else {
          var category = categories[state.view];
          var categoryTasks = ordered(state.tasks.filter(function (task) { return task.category === state.view; }));
          var visible = state.filter === "all" ? categoryTasks : categoryTasks.filter(function (task) { return state.filter === "done" ? task.completed : !task.completed; });
          heading.innerHTML = '<div><p class="eyebrow">' + category.name + '</p><h1>' + category.name + '</h1><p>在这里查看未完成与已完成的全部安排。</p></div><button class="primary" type="button" data-add>＋ 新建事项</button>';
          content.innerHTML = (visible.length ? '<section class="tasks">' + visible.map(function(task){ return taskMarkup(task, false); }).join("") + '</section>' : '<div class="empty"><strong>这里还没有安排</strong>添加一项计划，或切换筛选查看其他记录。</div>');
        }
        document.getElementById("updated-at").textContent = "共 " + state.tasks.length + " 项安排";
      }
      function openDialog() {
        var form = document.getElementById("task-form");
        form.reset();
        form.elements.category.value = state.view === "overview" ? "recruiting" : state.view;
        form.elements.date.value = new Date().toISOString().slice(0, 10);
        dialog.showModal();
      }
      document.addEventListener("click", function (event) {
        var nav = event.target.closest("[data-view]");
        if (nav) { state.view = nav.getAttribute("data-view"); state.filter = nav.getAttribute("data-filter") || "all"; render(); return; }
        var filter = event.target.closest("[data-filter]");
        if (filter) { state.filter = filter.getAttribute("data-filter"); render(); return; }
        if (event.target.closest("[data-add]")) { openDialog(); return; }
        var toggle = event.target.closest("[data-toggle]");
        if (toggle) {
          var id = toggle.getAttribute("data-toggle");
          state.tasks = state.tasks.map(function(task) { return task.id === id ? Object.assign({}, task, { completed: toggle.checked }) : task; });
          saveTasks(); render(); return;
        }
        var remove = event.target.closest("[data-delete]");
        if (remove) {
          var taskId = remove.getAttribute("data-delete");
          if (window.confirm("确定删除这项安排吗？")) { state.tasks = state.tasks.filter(function(task){ return task.id !== taskId; }); saveTasks(); render(); }
        }
      });
      document.getElementById("close-dialog").addEventListener("click", function(){ dialog.close(); });
      document.getElementById("cancel-dialog").addEventListener("click", function(){ dialog.close(); });
      document.getElementById("task-form").addEventListener("submit", function(event) {
        event.preventDefault();
        var data = new FormData(event.currentTarget);
        state.tasks.push({
          id: "task-" + Date.now(),
          category: data.get("category"),
          date: data.get("date"),
          time: data.get("time"),
          title: data.get("title").trim(),
          priority: data.get("priority"),
          note: data.get("note").trim(),
          completed: false
        });
        saveTasks(); dialog.close(); state.view = data.get("category"); state.filter = "all"; render();
      });
      render();
    }());
  </script>
</body>
</html>
