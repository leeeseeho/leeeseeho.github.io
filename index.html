<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="李世豪的个人日程安排">
  <title>李世豪｜个人日程</title>
  <style>
    :root {
      --ink: #172033; --muted: #687083; --line: #e9ebf0; --paper: #ffffff;
      --ground: #f6f7fb; --blue: #3667e8; --blue-soft: #eaf0ff;
      --violet: #8455d6; --violet-soft: #f1eaff; --green: #159a62;
      --green-soft: #e5f7ef; --shadow: 0 12px 35px rgba(29, 43, 79, .08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--ground); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.5; }
    .shell { max-width: 1120px; margin: 0 auto; padding: 34px 26px 64px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 30px; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
    .avatar { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; color: #fff; font-weight: 800; background: linear-gradient(135deg, #386ae8, #774ed6); box-shadow: 0 5px 14px rgba(54, 103, 232, .25); }
    .brand span { font-weight: 750; font-size: 1.05rem; }
    .resume-link { border: 1px solid #dfe4f0; border-radius: 10px; padding: 9px 14px; color: var(--ink); text-decoration: none; font-size: .9rem; font-weight: 650; background: var(--paper); }
    .resume-link:hover { border-color: var(--blue); color: var(--blue); }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 22px; margin-bottom: 24px; }
    h1 { margin: 0 0 7px; font-size: clamp(1.75rem, 4vw, 2.5rem); letter-spacing: -.035em; }
    .intro p { margin: 0; color: var(--muted); }
    .month { color: var(--blue); font-weight: 700; font-size: .94rem; }
    .summary { display: flex; gap: 10px; flex-wrap: wrap; }
    .metric { border: 1px solid #e5e8ef; border-radius: 11px; padding: 10px 13px; min-width: 104px; background: var(--paper); }
    .metric b { display: block; font-size: 1.15rem; }
    .metric small { color: var(--muted); font-size: .78rem; }
    .panel { overflow: hidden; border: 1px solid #e5e8ef; border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); }
    .panel-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 21px 24px 16px; border-bottom: 1px solid var(--line); }
    .panel-header h2 { margin: 0; font-size: 1.04rem; }
    .hint { color: var(--muted); font-size: .82rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { padding: 18px 24px; text-align: left; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 650; font-size: .78rem; letter-spacing: .04em; }
    td { font-size: .94rem; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr { transition: background .18s; }
    tbody tr:hover { background: #fbfcff; }
    .date { min-width: 146px; font-weight: 750; }
    .date small { display: block; margin-top: 3px; color: var(--muted); font-weight: 500; font-size: .78rem; }
    .time { white-space: nowrap; }
    .event { max-width: 390px; font-weight: 600; }
    .priority { display: inline-flex; align-items: center; color: #a85b00; background: #fff4dd; border-radius: 999px; padding: 4px 10px; font-size: .8rem; font-weight: 700; }
    .status { display: inline-flex; align-items: center; gap: 8px; color: #4d435f; cursor: pointer; user-select: none; white-space: nowrap; }
    .status input { position: absolute; opacity: 0; }
    .check { width: 18px; height: 18px; border-radius: 5px; border: 1px solid #d2bee8; background: linear-gradient(135deg, #fff, var(--violet-soft)); transition: .18s; }
    .status input:checked + .check { border-color: var(--green); background: var(--green); box-shadow: inset 0 0 0 4px #fff; }
    tr.done .event { color: var(--muted); text-decoration: line-through; }
    tr.done .status { color: var(--green); }
    .note { color: var(--muted); font-size: .86rem; }
    .footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 18px; padding: 0 3px; color: var(--muted); font-size: .8rem; }
    button { border: 0; padding: 0; background: none; color: var(--blue); cursor: pointer; font: inherit; }
    button:hover { text-decoration: underline; }
    @media (max-width: 640px) {
      .shell { padding: 22px 15px 44px; }
      .topbar, .intro, .footer { align-items: flex-start; flex-direction: column; }
      .topbar { margin-bottom: 24px; }
      .resume-link { width: 100%; text-align: center; }
      .panel-header { align-items: flex-start; flex-direction: column; padding: 18px 18px 14px; }
      th, td { padding: 16px 18px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="主导航">
      <a class="brand" href="./" aria-label="个人日程主页"><span class="avatar">李</span><span>李世豪 · 日程</span></a>
      <a class="resume-link" href="resume/">查看个人简历 →</a>
    </nav>

    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="month">2026 年 9 月</p>
        <h1 id="page-title">本月计划</h1>
        <p>专注眼前事项，按优先级逐项完成。</p>
      </div>
      <div class="summary" aria-label="日程统计">
        <div class="metric"><b id="pending-count">3</b><small>待完成</small></div>
        <div class="metric"><b id="done-count">0</b><small>已完成</small></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="schedule-title">
      <div class="panel-header">
        <h2 id="schedule-title">近期日程</h2>
        <span class="hint">完成状态仅保存在当前浏览器</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>日期</th><th>时间</th><th>事项</th><th>优先级</th><th>状态</th><th>备注</th></tr></thead>
          <tbody id="schedule-body">
            <tr data-id="nanoxin-review">
              <td class="date">9月10日（周四）<small>2026</small></td>
              <td class="time">晚上</td>
              <td class="event">复习纳芯微之前的笔试题、面试题</td>
              <td><span class="priority">高</span></td>
              <td><label class="status"><input type="checkbox" aria-label="标记复习纳芯微之前的笔试题、面试题为完成"><span class="check"></span><span class="status-text">待完成</span></label></td>
              <td class="note">为次日面试准备</td>
            </tr>
            <tr data-id="nanoxin-interview">
              <td class="date">9月11日（周五）<small>2026</small></td>
              <td class="time">晚上</td>
              <td class="event">纳芯微面试</td>
              <td><span class="priority">高</span></td>
              <td><label class="status"><input type="checkbox" aria-label="标记纳芯微面试为完成"><span class="check"></span><span class="status-text">待完成</span></label></td>
              <td class="note">具体时间暂未记录</td>
            </tr>
            <tr data-id="bfr-interview">
              <td class="date">9月17日（周四）<small>2026</small></td>
              <td class="time">16:00</td>
              <td class="event">晶丰明源面试</td>
              <td><span class="priority">高</span></td>
              <td><label class="status"><input type="checkbox" aria-label="标记晶丰明源面试为完成"><span class="check"></span><span class="status-text">待完成</span></label></td>
              <td class="note">—</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer class="footer">
      <span>日程数据不会上传到服务器。</span>
      <button id="reset-status" type="button">重置完成状态</button>
    </footer>
  </main>
  <script>
    (function () {
      var key = "leeeseeho-schedule-completed-v1";
      var rows = Array.prototype.slice.call(document.querySelectorAll("#schedule-body tr"));
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem(key) || "{}"); } catch (error) { saved = {}; }

      function updateRow(row, completed) {
        var checkbox = row.querySelector("input");
        var text = row.querySelector(".status-text");
        checkbox.checked = completed;
        row.classList.toggle("done", completed);
        text.textContent = completed ? "已完成" : "待完成";
      }
      function updateCounts() {
        var done = rows.filter(function (row) { return row.querySelector("input").checked; }).length;
        document.getElementById("done-count").textContent = done;
        document.getElementById("pending-count").textContent = rows.length - done;
      }
      rows.forEach(function (row) {
        var id = row.getAttribute("data-id");
        updateRow(row, saved[id] === true);
        row.querySelector("input").addEventListener("change", function (event) {
          saved[id] = event.target.checked;
          try { localStorage.setItem(key, JSON.stringify(saved)); } catch (error) {}
          updateRow(row, event.target.checked);
          updateCounts();
        });
      });
      document.getElementById("reset-status").addEventListener("click", function () {
        saved = {};
        try { localStorage.removeItem(key); } catch (error) {}
        rows.forEach(function (row) { updateRow(row, false); });
        updateCounts();
      });
      updateCounts();
    }());
  </script>
</body>
</html>
